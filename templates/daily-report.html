<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --ivory: #FAF9F5;
  --paper: #FFFFFF;
  --slate: #141413;
  --clay: #D97757;
  --clay-d: #B85C3E;
  --clay-light: #F4E0D9;
  --olive: #788C5D;
  --olive-light: #E8F0DE;
  --amber: #B8860B;
  --amber-light: #FDF3D7;
  --red: #C44B4B;
  --red-light: #FCE8E8;
  --blue: #4B7BC4;
  --blue-light: #E3F2FD;
  --g100: #F0EEE6;
  --g200: #E6E3DA;
  --g300: #D1CFC5;
  --g500: #87867F;
  --g700: #3D3D3A;
  --serif: ui-serif, Georgia, "Times New Roman", Times, serif;
  --sans: Roboto, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "Roboto Mono", ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  --max-w: 900px;
  --radius: 8px;
  /* cbp-base.css compat */
  --kb-bg: var(--ivory); --kb-surface: var(--paper); --kb-text: var(--slate);
  --kb-text-s: var(--g700); --kb-text-m: var(--g500); --kb-accent: var(--clay); --kb-border: var(--g300);
}
[data-theme="dark"] {
  --ivory: #1a1a2e;
  --paper: #16213e;
  --slate: #e0e0e0;
  --g100: #1e1e3a;
  --g200: #2a2a4a;
  --g300: #3a3a5a;
  --g500: #a0a0a0;
  --g700: #c0c0c0;
  --clay-light: #3d2520;
  --olive-light: #1e2e1a;
  --amber-light: #2e2510;
  --red-light: #2e1a1a;
  --blue-light: #1a2535;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--ivory); color: var(--slate); font-family: var(--sans); line-height: 1.6; transition: background 200ms, color 200ms; }

/* Progress bar */
.progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: var(--clay); z-index: 9999; width: 0%; transition: width 100ms; }

/* Nav controls */
/* Nav controls — handled by cbp-base.css */

/* Back to top */
.back-to-top { position: fixed; bottom: 24px; right: 24px; z-index: 1000; width: 40px; height: 40px; border-radius: 50%; background: var(--clay); color: #fff; border: none; font-size: 18px; cursor: pointer; box-shadow: 0 4px 12px rgba(20,20,19,.15); opacity: 0; transform: translateY(10px); transition: opacity 200ms, transform 200ms; pointer-events: none; display: flex; align-items: center; justify-content: center; }
.back-to-top.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

/* Layout */
.wrap { max-width: var(--max-w); margin: 0 auto; padding: 0 32px 80px; }

/* === HEADER: Daily uses left-aligned, Weekly uses centered hero === */
header { padding: 48px 0 32px; border-bottom: 1.5px solid var(--g300); margin-bottom: 32px; }
header.hero { text-align: center; padding: 60px 0 48px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--g500); margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
.eyebrow::before { content: ""; width: 24px; height: 1.5px; background: var(--clay); }
header.hero .eyebrow { justify-content: center; }
header.hero .eyebrow::before { display: none; }
header.hero .eyebrow { color: var(--clay); }
h1 { font-family: var(--serif); font-weight: 500; font-size: 32px; line-height: 1.2; margin: 0 0 8px; }
header.hero h1 { font-size: 36px; font-weight: 600; }
.intro { font-size: 15px; color: var(--g700); margin-top: 12px; }
header.hero .intro { max-width: 600px; margin: 12px auto 0; }

/* === STATS (Weekly only) === */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 48px; }
.stat-card { background: var(--paper); border: 1.5px solid var(--g300); border-radius: 12px; padding: 20px; text-align: center; }
.stat-card .num { font-family: var(--serif); font-size: 28px; font-weight: 700; color: var(--clay); }
.stat-card .label { font-size: 12px; color: var(--g500); margin-top: 4px; }

/* TOC */
nav.toc { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 40px; position: sticky; top: 0; background: var(--ivory); padding: 12px 0; z-index: 50; border-bottom: 1px solid var(--g200); }
nav.toc a { display: inline-block; padding: 5px 14px; border-radius: 20px; font-size: 13px; text-decoration: none; color: var(--g700); background: var(--g100); border: 1px solid var(--g200); transition: background 0.2s cubic-bezier(0.23,1,0.32,1), color 0.2s, border-color 0.2s, transform 0.15s cubic-bezier(0.23,1,0.32,1); }
nav.toc a:active { transform: scale(0.95); }
nav.toc a:hover, nav.toc a.active { background: var(--clay); color: #fff; border-color: var(--clay); }

/* Sections */
section { margin-bottom: 48px; }
h2 { font-family: var(--serif); font-size: 22px; font-weight: 500; margin: 0 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--g200); }
h3 { font-size: 15px; font-weight: 500; margin: 16px 0 8px; }

/* Cards */
.card { background: var(--paper); border: 1.5px solid var(--g300); border-radius: 12px; margin: 16px 0; overflow: hidden; transition: box-shadow .2s; }
.card:hover { box-shadow: 0 4px 16px rgba(20,20,19,.06); }
.card-header { padding: 16px 20px; }
.card-title { font-size: 15px; font-weight: 500; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.card-title i { color: var(--clay); }
.card-desc { font-size: 13px; color: var(--g700); }
.card-body { padding: 0 20px 16px; font-size: 14px; color: var(--g700); }
.card-body ul, .card ul { padding-left: 1.2rem; margin: 8px 0; }
.card-body li, .card li { margin-bottom: 4px; font-size: 13px; }

/* Collapsible details — asymmetric timing (Emil: slow open, fast close) */
details.topic-detail { border-top: 1px solid var(--g200); }
details.topic-detail summary { padding: 12px 20px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--clay); list-style: none; display: flex; align-items: center; gap: 6px; }
details.topic-detail summary::before { content: "▸"; transition: transform 200ms cubic-bezier(0.23,1,0.32,1); }
details.topic-detail[open] summary::before { transform: rotate(90deg); }
details.topic-detail .detail-body { padding: 0 20px 16px; font-size: 13px; color: var(--g700); line-height: 1.7; animation: detailOpen 350ms cubic-bezier(0.23,1,0.32,1); }
details.topic-detail .detail-body ul { padding-left: 1.2rem; margin: 8px 0; }
details.topic-detail .detail-body li { margin-bottom: 4px; }
@keyframes detailOpen { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

/* Card stagger (Emil: 30-80ms between items) */
.card { animation: cardFadeIn 400ms cubic-bezier(0.23,1,0.32,1) both; }
.card:nth-child(1) { animation-delay: 0ms; }
.card:nth-child(2) { animation-delay: 60ms; }
.card:nth-child(3) { animation-delay: 120ms; }
.card:nth-child(4) { animation-delay: 180ms; }
@keyframes cardFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 12px 0; }
th { background: var(--g100); text-align: left; padding: 8px 12px; font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid var(--g300); }
td { padding: 8px 12px; border-bottom: 1px solid var(--g200); }

/* Badges */
.badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 600; font-family: var(--mono); }
.badge-pass, .badge-new { background: var(--olive-light); color: var(--olive); }
.badge-fail { background: var(--clay-light); color: var(--clay); }
.badge-error { background: var(--amber-light); color: var(--amber); }
.badge-info, .badge-fix { background: var(--blue-light); color: var(--blue); }
.badge-warn, .badge-rule { background: var(--amber-light); color: var(--amber); }
.badge-tr { background: var(--red-light); color: var(--red); }

/* Code */
pre { background: var(--g100); border: 1.5px solid var(--g300); border-radius: var(--radius); padding: 14px 16px; overflow-x: auto; font-family: var(--mono); font-size: 12px; line-height: 1.5; margin: 10px 0; position: relative; }
pre .copy-btn { position: absolute; top: 8px; right: 8px; background: var(--paper); border: 1px solid var(--g300); border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; opacity: 0; transition: opacity 150ms; }
pre:hover .copy-btn { opacity: 1; }
code { font-family: var(--mono); font-size: 12px; background: var(--g100); padding: 2px 6px; border-radius: 3px; }

/* File list */
.file-list { list-style: none; padding: 0; }
.file-list li { padding: 8px 0; border-bottom: 1px solid var(--g100); font-family: var(--mono); font-size: 12px; color: var(--g700); }
.file-list li:last-child { border-bottom: none; }

/* Notes */
.note { border-left: 3px solid var(--clay); padding: 8px 16px; background: #FDF8F5; border-radius: 0 var(--radius) var(--radius) 0; font-size: 13px; margin: 12px 0; }

/* Bilingual */
[lang="en"] .zh { display: none; }
[lang="zh-CN"] .en { display: none; }

/* Footer */
footer { margin-top: 60px; border-top: 1.5px solid var(--g300); padding-top: 20px; font-size: 13px; color: var(--g500); text-align: center; }

@media (max-width: 600px) { .stats { grid-template-columns: repeat(2, 1fr); } h1 { font-size: 26px; } }
/* Nav fallback (when cbp-base.css unreachable, e.g. email attachment) */
.cbp-nav { position: sticky; top: 0; z-index: 999; background: var(--paper); border-bottom: 1px solid var(--g300); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 56px; width: 100%; font-family: var(--sans); }
.cbp-nav .brand { font-family: var(--serif); font-weight: 700; font-size: 1.2rem; color: var(--slate); text-decoration: none; display: flex; align-items: center; gap: 8px; }
.cbp-nav .brand i { color: var(--clay); }
.cbp-nav .nav-controls { display: flex; gap: 8px; align-items: center; }
.cbp-nav .nav-controls button { border: 1.5px solid var(--g300); background: var(--paper); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--g500); transition: all .15s; }
.cbp-nav .nav-controls button.active, .cbp-nav .nav-controls button:hover { background: var(--clay); color: #fff; border-color: var(--clay); }
.cbp-nav .back-link { font-size: .8rem; color: var(--g500); text-decoration: none; display: flex; align-items: center; gap: 4px; }

/* cbp-fx v1: reduced motion + card spotlight + button fill */
:root { --fx-spot: rgba(217,119,87,.08); --fx-fill: rgba(217,119,87,.14); }
.card, .stat-card { background-image: radial-gradient(420px circle at var(--mx, -999px) var(--my, -999px), var(--fx-spot), transparent 45%); }
.cbp-nav .nav-controls button { position: relative; }
.cbp-nav .nav-controls button, .back-to-top { overflow: hidden; isolation: isolate; }   /* back-to-top stays position: fixed */
.cbp-nav .nav-controls button::before, .back-to-top::before {
  content: ""; position: absolute; top: 50%; left: 50%; width: 0; height: 0; z-index: -1; border-radius: 50%;
  background: var(--fx-fill); transform: translate(-50%, -50%); transition: width .5s ease, height .5s ease; pointer-events: none;
}
.back-to-top::before { background: rgba(255,255,255,.22); }
.cbp-nav .nav-controls button:hover::before, .cbp-nav .nav-controls button:focus-visible::before,
.back-to-top:hover::before, .back-to-top:focus-visible::before { width: 240px; height: 240px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
<link rel="stylesheet" href="../../cbp-base.css">
</head>
<body>
<nav class="cbp-nav">
  <a href="../../index.html" class="brand"><i class="fas fa-bolt"></i> Pure Lab</a>
  <div class="nav-controls">
    <button onclick="switchLang('zh-CN')" id="btnZh">中文</button>
    <button class="active" onclick="switchLang('en')" id="btnEn">EN</button>
    <button onclick="toggleTheme()" id="btnTheme"><i class="fas fa-moon"></i></button>
    <a href="../../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
  </div>
</nav>
<div class="progress-bar" id="progressBar"></div>
<button class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<div class="wrap">

  <!-- ============================================================
       HEADER VARIANTS:
       - Daily: use <header> (left-aligned)
       - Weekly: use <header class="hero"> (centered)
       ============================================================ -->

  <!-- DAILY HEADER -->
  <header>
    <div class="eyebrow"><span class="zh">每日对话总结</span><span class="en">Daily Summary</span></div>
    <h1>{{DATE}}</h1>
    <p class="intro">
      <span class="zh">{{INTRO_ZH}}</span>
      <span class="en">{{INTRO_EN}}</span>
    </p>
  </header>

  <!-- WEEKLY HEADER (replace above for weekly reports)
  <header class="hero">
    <div class="eyebrow">Weekly Review · {{WEEK_ID}} · {{YEAR}}</div>
    <h1>
      <span class="zh">{{TITLE_ZH}}</span>
      <span class="en">{{TITLE_EN}}</span>
    </h1>
    <p class="intro">
      <span class="zh">{{SUBTITLE_ZH}}</span>
      <span class="en">{{SUBTITLE_EN}}</span>
    </p>
  </header>
  -->

  <!-- ============================================================
       STATS (Weekly only — remove for daily reports)
       ============================================================ -->
  <!--
  <div class="stats">
    <div class="stat-card"><div class="num">{{STAT1_NUM}}</div><div class="label"><span class="zh">{{STAT1_ZH}}</span><span class="en">{{STAT1_EN}}</span></div></div>
    <div class="stat-card"><div class="num">{{STAT2_NUM}}</div><div class="label"><span class="zh">{{STAT2_ZH}}</span><span class="en">{{STAT2_EN}}</span></div></div>
    <div class="stat-card"><div class="num">{{STAT3_NUM}}</div><div class="label"><span class="zh">{{STAT3_ZH}}</span><span class="en">{{STAT3_EN}}</span></div></div>
    <div class="stat-card"><div class="num">{{STAT4_NUM}}</div><div class="label"><span class="zh">{{STAT4_ZH}}</span><span class="en">{{STAT4_EN}}</span></div></div>
  </div>
  -->

  <!-- ============================================================
       TOC
       ============================================================ -->
  <nav class="toc">
    {{TOC}}
    <!-- Example:
    <a href="#s1"><span class="zh">主题一</span><span class="en">Topic 1</span></a>
    -->
  </nav>

  <!-- ============================================================
       SECTIONS (same structure for daily and weekly)
       ============================================================ -->
  {{SECTIONS}}
  <!--
  === Card with collapsible detail (daily typical) ===

  <section id="s1">
    <h2><span class="zh">🔧 标题</span><span class="en">🔧 Title</span></h2>
    <div class="card">
      <div class="card-header">
        <div class="card-title"><i class="fas fa-icon"></i> <span class="zh">卡片标题</span><span class="en">Card Title</span> <span class="badge badge-new">NEW</span></div>
        <div class="card-desc"><span class="zh">描述</span><span class="en">Description</span></div>
      </div>
      <details class="topic-detail">
        <summary><span class="zh">详情</span><span class="en">Details</span></summary>
        <div class="detail-body"><ul><li>...</li></ul></div>
      </details>
    </div>
  </section>

  === Card with list (weekly typical) ===

  <section id="growth">
    <h2><span class="zh"><i class="fas fa-seedling"></i> 能力成长</span><span class="en"><i class="fas fa-seedling"></i> Capability Growth</span></h2>
    <div class="card">
      <div class="card-title"><i class="fas fa-chart-bar"></i> Feature Name <span class="badge badge-new">NEW</span></div>
      <ul>
        <li><span class="zh">要点</span><span class="en">Point</span></li>
      </ul>
    </div>
  </section>

  === Table (shared) ===

  <table>
    <tr><th>Case</th><th>Result</th><th>Note</th></tr>
    <tr><td>Name</td><td><span class="badge badge-pass">Passed</span></td><td>...</td></tr>
    <tr><td>Name</td><td><span class="badge badge-fail">Failed</span></td><td>...</td></tr>
    <tr><td>Name</td><td><span class="badge badge-tr">TR-XXXX</span></td><td>...</td></tr>
  </table>

  === File list (daily typical) ===

  <section id="files">
    <h2><span class="zh">📁 生成文件</span><span class="en">📁 Generated Files</span></h2>
    <ul class="file-list">
      <li>path/to/file <span class="badge badge-info">new</span></li>
    </ul>
  </section>
  -->

  <footer>
    <span class="zh">由 Pure 自动生成 · {{GEN_DATE}}</span>
    <span class="en">Auto-generated by Pure · {{GEN_DATE}}</span>
  </footer>

</div>

<script>
function switchLang(lang) {
  document.documentElement.lang = lang;
  document.querySelectorAll('.nav-controls button').forEach(b => b.classList.remove('active'));
  document.getElementById(lang === 'zh-CN' ? 'btnZh' : 'btnEn').classList.add('active');
}
function toggleTheme() {
  const d = document.documentElement;
  d.dataset.theme = d.dataset.theme === 'dark' ? '' : 'dark';
  document.getElementById('btnTheme').innerHTML = d.dataset.theme === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
}
window.addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - window.innerHeight;
  document.getElementById('progressBar').style.width = (h > 0 ? window.scrollY / h * 100 : 0) + '%';
  document.getElementById('backToTop').classList.toggle('visible', window.scrollY > 300);
});
// TOC highlight
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      document.querySelectorAll('nav.toc a').forEach(a => a.classList.remove('active'));
      const link = document.querySelector('nav.toc a[href="#' + e.target.id + '"]');
      if (link) link.classList.add('active');
    }
  });
}, { rootMargin: '-20% 0px -70% 0px' });
document.querySelectorAll('section[id]').forEach(s => obs.observe(s));
// Copy button
document.querySelectorAll('pre').forEach(pre => {
  const btn = document.createElement('button');
  btn.className = 'copy-btn';
  btn.textContent = 'Copy';
  btn.onclick = () => { navigator.clipboard.writeText(pre.textContent.replace('Copy','')); btn.textContent = '✓'; setTimeout(() => btn.textContent = 'Copy', 1500); };
  pre.appendChild(btn);
});
</script>
<script>
/* cbp-fx v1: card spotlight (one delegated listener, rAF-throttled; off under reduced motion) */
(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let raf = 0, last = null, x = 0, y = 0;
  document.addEventListener('mousemove', e => {
    const card = e.target.closest && e.target.closest('.card, .stat-card');
    if (last && last !== card) { last.style.removeProperty('--mx'); last.style.removeProperty('--my'); }
    last = card; x = e.clientX; y = e.clientY;          // listener only records; rAF reads the latest
    if (!card || raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      if (!last) return;
      const r = last.getBoundingClientRect();
      last.style.setProperty('--mx', (x - r.left) + 'px');
      last.style.setProperty('--my', (y - r.top) + 'px');
    });
  });
})();
</script>
</body>
</html>
