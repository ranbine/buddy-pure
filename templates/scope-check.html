<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@400;700&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f9fa;--fg:#1d2630;--clay:#4099ff;--clay-light:#d6edff;--olive:#2ed8b6;--olive-light:#d4f7ee;--amber:#ffb64d;--amber-light:#fff3d6;--red:#ff5370;--red-light:#ffe0e6;--gray:#5b6b79;--g100:#f3f5f7;--g200:#e8eaed;--g300:#dbe0e5;--border:#dbe0e5;--max-w:900px;--kb-bg:#f8f9fa;--kb-surface:#fff;--kb-text:#1d2630;--kb-text-s:#3e4853;--kb-text-m:#5b6b79;--kb-accent:#4099ff;--kb-border:#dbe0e5}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Roboto',sans-serif;background:var(--bg);color:var(--fg);line-height:1.6}
.progress-bar{position:fixed;top:0;left:0;height:3px;background:var(--clay);z-index:1000;transition:width .1s}
.nav-controls{display:flex;gap:8px;align-items:center}.nav-controls button{border:none;background:var(--g100);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--fg)}.nav-controls button:hover{background:var(--clay);color:#fff;border-color:var(--clay)}
[lang="zh"] .en{display:none} [lang="en"] .zh{display:none}
.container{max-width:var(--max-w);margin:0 auto;padding:40px 24px 80px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--clay);font-weight:500;margin-bottom:8px}
h1{font-family:'Roboto',serif;font-size:2rem;margin-bottom:12px}
.subtitle{color:var(--gray);font-size:15px;margin-bottom:32px}
nav.toc{position:sticky;top:0;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:32px;z-index:50;display:flex;gap:8px;flex-wrap:wrap}
nav.toc a{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;text-decoration:none;color:var(--fg);background:var(--g100);border:1px solid var(--border);transition:all .2s}
nav.toc a.active,nav.toc a:hover{background:var(--clay);color:#fff;border-color:var(--clay)}
section{margin-bottom:48px}
.section-num{font-family:'Roboto Mono',monospace;font-size:13px;color:var(--clay);margin-bottom:4px}
h2{font-family:'Roboto',serif;font-size:1.4rem;margin-bottom:16px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;padding:20px;text-align:center;border:1px solid var(--border);box-shadow:0 1px 3px rgba(4,26,55,.08)}
.stat-card .num{font-size:2rem;font-weight:700}.stat-card .label{font-size:12px;color:var(--gray);text-transform:uppercase;letter-spacing:1px}
.stat-card.passed .num{color:var(--olive)}.stat-card.failed .num{color:var(--red)}.stat-card.error .num{color:var(--amber)}.stat-card.notfound .num{color:var(--gray)}.stat-card.started .num{color:#673ab7}
.donut-container{display:flex;justify-content:center;margin:24px 0}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:16px}
th{background:var(--g100);text-align:left;padding:8px 10px;font-weight:500;border-bottom:2px solid var(--border);position:sticky;top:48px;cursor:pointer;user-select:none}
th:hover{background:var(--g200)}th::after{content:'';display:inline-block;margin-left:4px;font-size:10px;color:var(--gray)}
th.asc::after{content:'▲'}th.desc::after{content:'▼'}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:hover{background:var(--g100)}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.badge-passed{background:var(--olive-light);color:#0d5c4d}.badge-failed{background:var(--red-light);color:#d6354f}
.badge-error{background:var(--amber-light);color:#6b4c00}.badge-notfound{background:var(--g200);color:var(--gray)}.badge-started{background:#e8d5f5;color:#3b1f6e}
.case-name{font-family:'Roboto Mono',monospace;font-size:12px;word-break:break-all}
.case-name a{color:var(--fg);text-decoration:none;border-bottom:1px dashed var(--g300)}.case-name a:hover{color:var(--clay);border-bottom-color:var(--clay)}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:4px 12px;border-radius:16px;font-size:12px;border:1px solid var(--border);background:var(--bg);cursor:pointer;transition:all .2s}
.filter-btn:hover,.filter-btn.active{background:var(--clay);color:#fff;border-color:var(--clay)}
.back-top{position:fixed;bottom:24px;right:24px;width:40px;height:40px;border-radius:50%;background:var(--clay);color:#fff;border:none;cursor:pointer;font-size:18px;display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.back-top.show{display:flex}
.source-tag{font-size:11px;color:var(--gray)}.iter-tag{font-size:11px;background:var(--clay-light);color:var(--clay);padding:2px 6px;border-radius:3px;margin-left:8px}

/* cbp-fx v1: reduced motion + card spotlight + button fill */
:root { --fx-spot: rgba(64,153,255,.08); --fx-fill: rgba(64,153,255,.14); }
.card, .stat-card { background-image: radial-gradient(420px circle at var(--mx, -999px) var(--my, -999px), var(--fx-spot), transparent 45%); }
.cbp-nav .nav-controls button { position: relative; }
.cbp-nav .nav-controls button, .back-to-top, .back-top { overflow: hidden; isolation: isolate; }   /* back-to-top stays position: fixed */
.cbp-nav .nav-controls button::before, .back-to-top::before, .back-top::before {
  content: ""; position: absolute; top: 50%; left: 50%; width: 0; height: 0; z-index: -1; border-radius: 50%;
  background: var(--fx-fill); transform: translate(-50%, -50%); transition: width .5s ease, height .5s ease; pointer-events: none;
}
.back-to-top::before, .back-top::before { background: rgba(255,255,255,.22); }
.cbp-nav .nav-controls button:hover::before, .cbp-nav .nav-controls button:focus-visible::before,
.back-to-top:hover::before, .back-top:hover::before, .back-to-top:focus-visible::before, .back-top:focus-visible::before { width: 240px; height: 240px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="../../cbp-base.css"></head><body>
<nav class="cbp-nav"><a href="../../index.html" class="brand"><i class="fas fa-bolt"></i> Pure Lab</a><div class="nav-controls"><button onclick="toggleLang()"><span class="zh">EN</span><span class="en">中文</span></button><a href="../../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a></div></nav>
<div class="progress-bar" id="progressBar"></div>
<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<div class="container">
{{CONTENT}}
</div>
<script>
window.addEventListener('scroll',()=>{const h=document.documentElement;document.getElementById('progressBar').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight))*100+'%';document.getElementById('backTop').classList.toggle('show',h.scrollTop>300)});
function toggleLang(){document.documentElement.lang=document.documentElement.lang==='zh'?'en':'zh'}
const obs=new IntersectionObserver(e=>{e.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('nav.toc a').forEach(l=>l.classList.remove('active'));const l=document.querySelector(`nav.toc a[href="#${e.target.id}"]`);if(l)l.classList.add('active')}})},{rootMargin:'-20% 0px -70% 0px'});
document.querySelectorAll('section[id]').forEach(s=>obs.observe(s));
document.querySelectorAll('.filter-btn').forEach(b=>{b.addEventListener('click',function(){this.parentElement.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active');const f=this.dataset.filter,t=this.parentElement.nextElementSibling;if(!t)return;t.querySelectorAll('tbody tr').forEach(r=>{if(r.classList.contains('detail-row')){r.style.display=r.previousElementSibling?.style.display||''}else{r.style.display=f==='all'?'':r.dataset.status===f?'':'none'}})})});
document.querySelectorAll('.result-table th').forEach(th=>{th.addEventListener('click',function(){const table=this.closest('table'),tbody=table.querySelector('tbody'),idx=Array.from(this.parentElement.children).indexOf(this);const groups=[];let cur=null;tbody.querySelectorAll('tr').forEach(r=>{if(!r.classList.contains('detail-row')){cur={main:r,detail:null};groups.push(cur)}else if(cur){cur.detail=r}});const isAsc=this.classList.contains('asc');table.querySelectorAll('th').forEach(h=>h.classList.remove('asc','desc'));this.classList.add(isAsc?'desc':'asc');const dir=isAsc?-1:1;groups.sort((a,b)=>{let va=a.main.children[idx]?.textContent.trim()||'',vb=b.main.children[idx]?.textContent.trim()||'';if(idx===2){const na=parseInt(va.split('-').pop())||0,nb=parseInt(vb.split('-').pop())||0;return(na-nb)*dir}return va.localeCompare(vb)*dir});groups.forEach(g=>{tbody.appendChild(g.main);if(g.detail)tbody.appendChild(g.detail)})})});
</script><script>
/* cbp-fx v1: card spotlight (one delegated listener, rAF-throttled; off under reduced motion) */
(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let raf = 0, last = null, x = 0, y = 0;
  document.addEventListener('mousemove', e => {
    const card = e.target.closest && e.target.closest('.card, .stat-card');
    if (last && last !== card) { last.style.removeProperty('--mx'); last.style.removeProperty('--my'); }
    last = card; x = e.clientX; y = e.clientY;          // listener only records; rAF reads the latest
    if (!card || raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      if (!last) return;
      const r = last.getBoundingClientRect();
      last.style.setProperty('--mx', (x - r.left) + 'px');
      last.style.setProperty('--my', (y - r.top) + 'px');
    });
  });
})();
</script>
</body></html>
