<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../../cbp-base.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --ivory: #FAF9F5;
  --paper: #FFFFFF;
  --slate: #141413;
  --clay: #D97757;
  --clay-d: #B85C3E;
  --clay-light: #F4E0D9;
  --olive: #788C5D;
  --olive-light: #E8F0DE;
  --amber: #B8860B;
  --amber-light: #FDF3D7;
  --red: #C44B4B;
  --red-light: #FCE8E8;
  --blue: #4B7BC4;
  --blue-light: #E3F2FD;
  --g100: #F0EEE6;
  --g200: #E6E3DA;
  --g300: #D1CFC5;
  --g500: #87867F;
  --g700: #3D3D3A;
  --sans: Roboto, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "Roboto Mono", ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  --max-w: 960px;
  --radius: 8px;
  /* cbp-base.css compat */
  --kb-bg: var(--ivory); --kb-surface: var(--paper); --kb-text: var(--slate);
  --kb-text-s: var(--g700); --kb-text-m: var(--g500); --kb-accent: var(--clay); --kb-border: var(--g300);
}
[data-theme="dark"] {
  --ivory: #1a1a2e;
  --paper: #16213e;
  --slate: #e0e0e0;
  --g100: #1e1e3a;
  --g200: #2a2a4a;
  --g300: #3a3a5a;
  --g500: #a0a0a0;
  --g700: #c0c0c0;
  --clay-light: #3d2520;
  --olive-light: #1e2e1a;
  --amber-light: #2e2510;
  --red-light: #2e1a1a;
  --blue-light: #1a2535;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--ivory); color: var(--slate); font-family: var(--sans); line-height: 1.6; transition: background 200ms, color 200ms; }

.progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: var(--clay); z-index: 9999; width: 0%; transition: width 100ms; }
.back-to-top { position: fixed; bottom: 2rem; right: 2rem; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--g300); background: var(--paper); cursor: pointer; opacity: 0; transition: opacity 200ms; font-size: 18px; }
.back-to-top.visible { opacity: 1; }

.wrap { max-width: var(--max-w); margin: 0 auto; padding: 20px 24px 60px; }

/* Header */
.header { text-align: center; margin-bottom: 2rem; padding: 2rem 0; border-bottom: 2px solid var(--clay); }
.header h1 { color: var(--clay); margin: 0 0 8px 0; font-size: 1.8rem; }
.header .subtitle { color: var(--g500); font-size: 0.9rem; }

/* Stats grid */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 1.5rem 0; }
.stat { background: var(--paper); border: 1px solid var(--g300); border-radius: var(--radius); padding: 14px; text-align: center; }
.stat .num { font-size: 28px; font-weight: 700; color: var(--clay); }
.stat .label { font-size: 12px; color: var(--g500); }

/* Section */
section { margin-top: 2rem; }
section h2 { color: var(--olive); font-size: 1.3rem; margin-bottom: 1rem; }

/* Cards */
.card { background: var(--paper); border: 1px solid var(--g300); border-radius: var(--radius); padding: 16px; margin: 12px 0; }
.card.friction { border-left: 4px solid var(--clay); }
.card.resolved { border-left: 4px solid var(--olive); }
.card.suggestion { border-left: 4px solid var(--amber); }
.card strong { display: block; margin-bottom: 4px; }
.card p { margin: 0; color: var(--g700); font-size: 0.9rem; }

/* Tags */
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; margin-right: 6px; }
.tag-open { background: var(--clay-light); color: var(--clay-d); }
.tag-resolved { background: var(--olive-light); color: var(--olive); }
.tag-suggestion { background: var(--amber-light); color: var(--amber); }

/* Table */
table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
th, td { padding: 6px 10px; border: 1px solid var(--g300); text-align: center; }
th { background: var(--g100); }

/* Chart */
canvas { background: var(--paper); border: 1px solid var(--g300); border-radius: var(--radius); padding: 12px; margin: 16px 0; }

/* Pattern / Recommendation boxes */
.pattern { background: var(--g100); padding: 12px; border-radius: 6px; margin: 8px 0; }
.rec { background: var(--olive-light); padding: 16px; border-radius: var(--radius); border-left: 4px solid var(--olive); }

/* cbp-fx v1: reduced motion + card spotlight + button fill */
:root { --fx-spot: rgba(217,119,87,.08); --fx-fill: rgba(217,119,87,.14); }
.card, .stat-card { background-image: radial-gradient(420px circle at var(--mx, -999px) var(--my, -999px), var(--fx-spot), transparent 45%); }
.cbp-nav .nav-controls button { position: relative; }
.cbp-nav .nav-controls button, .back-to-top { overflow: hidden; isolation: isolate; }   /* back-to-top stays position: fixed */
.cbp-nav .nav-controls button::before, .back-to-top::before {
  content: ""; position: absolute; top: 50%; left: 50%; width: 0; height: 0; z-index: -1; border-radius: 50%;
  background: var(--fx-fill); transform: translate(-50%, -50%); transition: width .5s ease, height .5s ease; pointer-events: none;
}

.cbp-nav .nav-controls button:hover::before, .cbp-nav .nav-controls button:focus-visible::before,
.back-to-top:hover::before, .back-to-top:focus-visible::before { width: 240px; height: 240px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<nav class="cbp-nav">
  <a href="../../index.html" class="brand"><i class="fas fa-bolt"></i> Pure Lab</a>
  <div class="nav-controls">
    <button onclick="switchLang('zh-CN')" id="btnZh">中文</button>
    <button class="active" onclick="switchLang('en')" id="btnEn">EN</button>
    <button onclick="toggleTheme()" id="btnTheme" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
    <a href="../../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
  </div>
</nav>
<div class="progress-bar" id="progressBar"></div>
<button class="back-to-top" id="backToTop" aria-label="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<div class="wrap">

  <div class="header">
    <h1 data-zh="{{TITLE_ZH}}" data-en="{{TITLE_EN}}">{{TITLE_EN}}</h1>
    <div class="subtitle" data-zh="{{SUBTITLE_ZH}} | 生成于 {{GEN_DATE}}" data-en="{{SUBTITLE_EN}} | Generated {{GEN_DATE}}">{{SUBTITLE_EN}} | Generated {{GEN_DATE}}</div>
  </div>

  <!-- ============================================================
       CONTENT PLACEHOLDERS
       ============================================================ -->

  <!-- STATS: Replace with actual stat cards -->
  <div class="stats">
    {{STATS}}
  </div>

  <!-- CHARTS: Insert <canvas> + Chart.js config -->
  {{CHARTS}}

  <!-- FRICTION CARDS: One .card per friction point -->
  <section id="frictions">
    <h2 data-zh="⚡ 摩擦点" data-en="⚡ Friction Points">⚡ Friction Points</h2>
    {{FRICTION_CARDS}}
  </section>

  <!-- PATTERNS -->
  <section id="patterns">
    <h2 data-zh="📊 模式观察" data-en="📊 Patterns">📊 Patterns</h2>
    {{PATTERNS}}
  </section>

  <!-- DATA TABLE -->
  <section id="data">
    <h2 data-zh="📋 数据" data-en="📋 Data">📋 Data</h2>
    {{TABLE}}
  </section>

  <!-- ACTIONS -->
  <section id="actions">
    <h2 data-zh="📌 行动项" data-en="📌 Action Items">📌 Action Items</h2>
    {{ACTIONS}}
  </section>

  <!-- RECOMMENDATION -->
  <section id="recommendation">
    <h2 data-zh="💡 建议" data-en="💡 Recommendation">💡 Recommendation</h2>
    <div class="rec">{{RECOMMENDATION}}</div>
  </section>

</div>

<script>
function switchLang(lang) {
  document.documentElement.lang = lang;
  document.querySelectorAll('.nav-controls button').forEach(b => b.classList.remove('active'));
  document.getElementById(lang === 'zh-CN' ? 'btnZh' : 'btnEn').classList.add('active');
  const isZh = lang === 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.innerHTML = isZh ? el.getAttribute('data-zh') : el.getAttribute('data-en');
  });
}
function toggleTheme() {
  const d = document.documentElement;
  d.dataset.theme = d.dataset.theme === 'dark' ? '' : 'dark';
  document.getElementById('btnTheme').innerHTML = d.dataset.theme === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
}
window.addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - window.innerHeight;
  document.getElementById('progressBar').style.width = (h > 0 ? window.scrollY / h * 100 : 0) + '%';
  document.getElementById('backToTop').classList.toggle('visible', window.scrollY > 300);
});
// Default to English
switchLang('en');
</script>
<script>
/* cbp-fx v1: card spotlight (one delegated listener, rAF-throttled; off under reduced motion) */
(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let raf = 0, last = null, x = 0, y = 0;
  document.addEventListener('mousemove', e => {
    const card = e.target.closest && e.target.closest('.card, .stat-card');
    if (last && last !== card) { last.style.removeProperty('--mx'); last.style.removeProperty('--my'); }
    last = card; x = e.clientX; y = e.clientY;          // listener only records; rAF reads the latest
    if (!card || raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      if (!last) return;
      const r = last.getBoundingClientRect();
      last.style.setProperty('--mx', (x - r.left) + 'px');
      last.style.setProperty('--my', (y - r.top) + 'px');
    });
  });
})();
</script>
</body>
</html>
